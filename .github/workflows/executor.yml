name: executor

on:
  pull_request:
  push:
    branches: [main, "cursor/**"]

jobs:
  executor:
    name: executor (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        # Node 22 still needs --experimental-strip-types on early 22.x.
        # Node 24 enables type stripping by default; the flag remains accepted.
        # Reported local failure was Node v26.13.1 on Windows (see the executor README).
        node: ["22", "24"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Executor tests
        # Explicit file list. PowerShell and cmd do not expand *.test.ts.
        run: node services/apex-executor/scripts/run-tests.mjs
      - name: IR-01 strategy tests
        run: python -m unittest scripts/test_ir01.py scripts/test_ir03.py scripts/test_alpaca_sip_entitlement.py scripts/test_oops.py
        env:
          PYTHONPATH: scripts
      - name: Research handoff and Hermes outcomes
        run: node --experimental-strip-types --test src/lib/apex/research/proposal.test.ts src/lib/apex/research/hermes-outcomes.test.ts src/lib/apex/research/multi-strategy.test.ts src/lib/apex/broker/paper-equity-transport.test.ts
      - name: Executor typecheck
        run: node services/apex-executor/scripts/typecheck.mjs
      - name: Deployment config and preexisting type errors
        run: node services/apex-executor/deploy/typecheck-guard.mjs
      - name: Mock lifecycle
        run: node --experimental-strip-types services/apex-executor/scripts/mock-lifecycle.mjs
