name: executor

on:
  pull_request:
  push:
    branches: [main, "cursor/**"]

jobs:
  executor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Executor tests
        run: node --experimental-strip-types --test 'services/apex-executor/test/*.test.ts'
      - name: Research handoff contract
        run: node --experimental-strip-types --test src/lib/apex/research/proposal.test.ts src/lib/apex/broker/paper-equity-transport.test.ts
      - name: Executor typecheck
        run: ./node_modules/.bin/tsc --noEmit --pretty false --strict --target ES2022 --module ESNext --moduleResolution bundler --allowImportingTsExtensions --skipLibCheck --types node services/apex-executor/src/*.ts
      - name: Deployment config and preexisting type errors
        run: node services/apex-executor/deploy/typecheck-guard.mjs
